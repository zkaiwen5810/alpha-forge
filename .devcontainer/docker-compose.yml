services:
  app:
    image: alpha-forge-devcontainer:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    env_file:
      - path: app.env
        required: false
    environment:
      SHELL: /usr/bin/zsh
      UV_CACHE_DIR: /workspaces/alpha-forge/.cache/uv
    volumes:
      - alpha-forge-repo:/workspaces/alpha-forge

  litellm:
    image: ghcr.io/berriai/litellm-database:main-latest
    command:
      - --config=/app/config.yaml
      - --port=4000
      - --num_workers=8
    env_file:
      - path: litellm.env
        required: false
      - path: cf-r2.env
        required: false
    environment:
      DATABASE_URL: postgresql://llmproxy:dbpassword9090@litellm-db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      PROXY_BATCH_WRITE_AT: ${PROXY_BATCH_WRITE_AT:-1}
      SPEND_LOG_QUEUE_POLL_INTERVAL: ${SPEND_LOG_QUEUE_POLL_INTERVAL:-0.25}
      SPEND_LOG_QUEUE_SIZE_THRESHOLD: ${SPEND_LOG_QUEUE_SIZE_THRESHOLD:-1}
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    depends_on:
      litellm-db:
        condition: service_healthy

  litellm-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - litellm-db-data:/var/lib/postgresql/data

volumes:
  alpha-forge-repo:
  litellm-db-data:
