services:
  app:
    image: alpha-forge-devcontainer:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    env_file:
      - path: app.env
        required: false
    environment:
      SHELL: /usr/bin/zsh
      UV_CACHE_DIR: /workspaces/alpha-forge/.cache/uv
    volumes:
      - alpha-forge-repo:/workspaces/alpha-forge

  litellm:
    image: ghcr.io/berriai/litellm-database:main-latest
    command:
      - --config=/app/config.yaml
      - --port=4000
      - --num_workers=8
    env_file:
      - path: litellm.env
        required: false
      - path: cf-r2.env
        required: false
    environment:
      DATABASE_URL: postgresql://llmproxy:dbpassword9090@litellm-db:5432/litellm
      STORE_MODEL_IN_DB: "True"
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    depends_on:
      litellm-db:
        condition: service_healthy
      # minio:
      #   condition: service_started
      # minio-init:
      #   condition: service_completed_successfully

  litellm-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - litellm-db-data:/var/lib/postgresql/data

  # minio:
  #   image: quay.io/minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   restart: unless-stopped
  #   env_file:
  #     - path: minio.env
  #       required: false
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio-data:/data

  # minio-init:
  #   image: quay.io/minio/mc:latest
  #   env_file:
  #     - path: minio.env
  #       required: false
  #   depends_on:
  #     minio:
  #       condition: service_started
