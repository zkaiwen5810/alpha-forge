[project]
name = "alpha-forge-langchain"
version = "0.1.0"
description = "Async streaming LangChain terminal agent with persistent conversations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.2.14,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "aiosqlite>=0.21,<1",
    "openai>=2.0,<3",
    "prompt-toolkit>=3.0.52,<4",
]

[project.scripts]
alpha-forge-langchain = "alpha_forge_langchain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alpha_forge_langchain"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["tests"]
