[project]
name = "alpha-forge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=6.30.1",
    "openai>=2.41.1",
    "prompt-toolkit>=3.0.52",
    "python-dotenv>=1.1.1",
]

[project.scripts]
alpha-forge = "alpha_forge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alpha_forge"]
